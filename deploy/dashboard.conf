server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional services are reached through host ports. If one is stopped,
    # only its routes return 502; the dashboard and other services keep working.
    location /api/home/ {
        proxy_pass http://host.docker.internal:8090;
    }
    location /api/events {
        proxy_pass http://host.docker.internal:8091;
    }
    location /api/health {
        proxy_pass http://host.docker.internal:8091;
    }
    location /api/snapshots/ {
        proxy_pass http://host.docker.internal:8091;
    }

    location /api/streams {
        proxy_pass http://host.docker.internal:1985;
    }
    location /api/ws {
        proxy_pass http://host.docker.internal:1985;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
