# Alerts service configuration. Secrets (Telegram token) live in ../.env.

# Frames are read from go2rtc's local RTSP server, so the DVRs see no extra
# connections regardless of how many detectors run.
go2rtc_rtsp: rtsp://127.0.0.1:8554

api_port: 8090
snapshot_dir: snapshots
snapshot_keep: 300

cameras:
  cam1: { label: "Cam 1", person_alerts: true }
  cam2: { label: "Cam 2", person_alerts: true }
  cam3: { label: "Cam 3", person_alerts: true }
  cam4: { label: "Cam 4", person_alerts: true }
  cam5: { label: "Cam 5", person_alerts: true }
  cam6: { label: "Cam 6", person_alerts: true }
  cam7: { label: "Cam 7", person_alerts: true }
  cam8: { label: "Cam 8", person_alerts: true }

health:
  down_after: 30        # s without a frame -> "camera down" (a go2rtc restart
                        # reconnects everything in ~20s and must not alert)
  recover_after: 10     # s of good condition before a recover event
  black_ratio: 0.15     # luma below this fraction of the camera's baseline = black
  black_min_base: 25    # only judge "black" if the camera normally has this much luma
  covered_ratio: 0.12   # sharpness below this fraction of baseline = covered
  covered_min_base: 25  # only judge "covered" if baseline sharpness is at least this
  sustain: 10           # s a condition must hold before alerting
  cooldown: 300         # s between repeat alerts of the same kind per camera

detection:
  model: yolo11n.pt     # auto-downloaded to models/ on first run
  imgsz: 352            # matches the 352x288 sub-streams
  interval: 0.7         # s between detection passes (all cameras batched)
  conf_day: 0.50
  conf_night: 0.40      # IR frames are noisier; catch more, debounce filters
  consecutive: 2        # passes a person must persist before alerting
  cooldown: 60          # s per camera between person alerts

# Helmet-check scaffolding: detect riders (person on motorcycle/scooter) on
# the parking camera and archive HD frames as future training data for a
# helmet classifier fine-tuned on this camera. Rider events stay off Telegram
# (see telegram.mute_kinds) — they exist for the dashboard + dataset for now.
helmet:
  camera: cam1
  motorcycle_conf: 0.35
  overlap: 0.15         # person-box overlap with motorcycle box (fraction of person area)
  cooldown: 90          # s between rider events
  dataset_dir: dataset/riders
  dataset_keep: 500     # newest HD frames kept for training

telegram:
  mute_kinds: [rider]   # event kinds that never go to Telegram

night:
  saturation_night: 10  # mean HSV saturation below this -> IR/night
  saturation_day: 22    # above this -> day (hysteresis band between the two)
  flip_grace: 20        # s after a day/night flip where health alerts are suppressed
